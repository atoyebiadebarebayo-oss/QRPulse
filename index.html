<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Pulse — Custom QR Code Generator & Tracker</title>
  <link rel="stylesheet" href="style.css">
  <!-- QRCode.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="header">
    <h1>QR Pulse</h1>
    <p>Dynamic QR Code Generator & Customization Studio</p>
  </div>

  <div class="layout">
    <!-- Controls Section -->
    <div class="card">
      <h2>1. Customize Your QR Code</h2>
      <form id="qrForm">
        <div class="form-group">
          <label for="qrContent">Destination URL / Text / WhatsApp Number</label>
          <input type="text" id="qrContent" placeholder="https://atoyebi8.gumroad.com" value="https://devpulse-adebare.netlify.app" required>
        </div>

        <div class="color-grid">
          <div class="form-group">
            <label for="fgColor">QR Code Color</label>
            <input type="color" id="fgColor" value="#10b981">
          </div>
          <div class="form-group">
            <label for="bgColor">Background Color</label>
            <input type="color" id="bgColor" value="#0f172a">
          </div>
        </div>

        <div class="form-group">
          <label for="qrSize">QR Code Size (px)</label>
          <select id="qrSize">
            <option value="180">Small (180x180)</option>
            <option value="240" selected>Medium (240x240)</option>
            <option value="320">Large (320x320)</option>
          </select>
        </div>

        <button type="submit">Generate QR Code</button>
      </form>
    </div>

    <!-- Live Preview Section -->
    <div class="card preview-card">
      <h2>2. Live QR Preview</h2>
      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>
      <p class="preview-note">Scan with your smartphone camera to test the link!</p>
      <button type="button" id="downloadBtn" class="btn-download">Download PNG</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
